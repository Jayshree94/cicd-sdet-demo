apiVersion: batch/v1
kind: Job
metadata:
  name: regression-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: regression-test
          image: cicd-sdet-tests:1
          imagePullPolicy: IfNotPresent
          command: ["mvn"]
          args: ["test", "-Dgroups=regression"]
